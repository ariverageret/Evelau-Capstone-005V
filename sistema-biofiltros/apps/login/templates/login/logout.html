{% load static %}
<!DOCTYPE html>
<html lang="es">
  {% include 'head.html' %}

<body class="bg-gray-50 min-h-screen flex flex-col"
      style="background: url('{% static 'login/fondo.jpg' %}') center/cover no-repeat;">

  <!-- Capa de blur solo para el contenido principal -->
  <main class="flex-1 flex items-center justify-center p-6 relative">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm z-0"></div>
    
    <div class="bg-white p-8 rounded-lg shadow-lg w-96 text-center z-10">
      <img src="{% static 'login/logo.png' %}" class="w-24 mx-auto mb-4" alt="Logo">
      <h1 class="text-2xl font-bold mb-2 text-gray-800">Sesión Cerrada</h1>
      <p class="text-gray-600 mb-6">Has cerrado sesión correctamente.</p>
      <a href="{% url 'login' %}" 
         class="inline-block px-6 py-2 bg-teal-700 text-white rounded hover:bg-teal-600 transition-colors">
        Volver al Login
      </a>
    </div>
  </main>

  {% include 'footer.html' %}

</body>
</html>
