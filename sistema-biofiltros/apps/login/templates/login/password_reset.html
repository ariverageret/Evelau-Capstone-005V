{% load static %}
<!DOCTYPE html>
<html lang="es">
{% include "head.html" %}

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- Fondo difuminado -->
  <div class="absolute inset-0">
    <img src="{% static 'login/fondo.jpg' %}" alt="Fondo" 
         class="w-full h-full object-cover filter blur-sm brightness-75">
  </div>

  <!-- Contenedor principal -->
  <div class="relative z-10 bg-white bg-opacity-80 backdrop-blur-md p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center text-gray-700">Recuperar Contraseña</h2>
    <p class="mb-4 text-gray-600 text-center">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <label for="id_email" class="block text-gray-600 mb-1">Email:</label>
      <input type="email" name="email" id="id_email" placeholder="Ingresa tu correo"
             class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-teal-500">

      <button type="submit" class="w-full bg-teal-700 hover:bg-teal-600 text-white font-bold py-2 px-4 rounded">
        Enviar enlace
      </button>
    </form>

    <p class="mt-4 text-center text-gray-500 text-sm">
      <a href="{% url 'login' %}" class="text-teal-700 hover:underline">Volver</a>
    </p>
  </div>
    <!-- Footer -->
  {% include "footer.html" %}
</body>

</html>
