{% load static %}

<header class="bg-gradient-to-r from-teal-900 to-teal-700 text-white 
               flex items-center justify-between shadow-lg px-4 sm:px-6 py-3 
               z-40 w-full sticky top-0">

  <!-- IZQUIERDA: Botón + Logo + Título -->
  <div class="flex items-center space-x-3 sm:space-x-4 flex-shrink">

    <!-- Botón toggle sidebar (solo móvil) -->
    <button id="toggleSidebar"
      class="lg:hidden text-white bg-teal-600 hover:bg-teal-500 px-2.5 py-2 
             rounded-lg shadow-md transition-all duration-200 focus:outline-none">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>

    <!-- Logo -->
    <img src="{% static 'login/logo.png' %}" alt="Logo"
         class="h-8 sm:h-10 w-auto drop-shadow-md">

    <!-- Títulos -->
    <div class="flex flex-col leading-tight">
      <h1 class="text-base sm:text-xl font-semibold tracking-wide">
        SensorFarms
      </h1>

      <!-- Subtítulo oculto en pantallas muy pequeñas -->
      <span class="text-teal-200 hidden sm:block text-xs sm:text-sm font-medium">
        Monitoreo de Aguas Grises
      </span>
    </div>
  </div>

  <!-- DERECHA: Usuario -->
  <div class="flex items-center space-x-3 sm:space-x-4">

    <!-- Nombre de usuario -->
    <span class="text-xs sm:text-sm text-teal-100 italic truncate max-w-[100px] sm:max-w-none">
      Bienvenid@, {{ user.username|default:'Invitado' }}
    </span>

    <!-- Botón Logout -->
    <a href="{% url 'logout' %}"
       class="flex items-center gap-1 sm:gap-2 bg-teal-600 hover:bg-teal-500 
              px-2 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium 
              transition-colors duration-200 whitespace-nowrap">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span class="hidden sm:inline">Cerrar sesión</span>
    </a>
  </div>

  <!-- Script: escucha el clic y lo envía globalmente -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("toggleSidebar");

      toggleBtn?.addEventListener("click", () => {
        window.dispatchEvent(new Event("toggle-sidebar")); // evento global
      });
    });
  </script>

</header>
